name: Upstream radar
on:
  schedule:
    - cron: '23 2 * * *' # ~11:23 JST; best effort
  workflow_dispatch:
    inputs:
      reference_apks:
        description: Download changed reference APKs as temporary test artifacts
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-watch.yml'
      - 'scripts/upstream_watch.py'
      - 'scripts/test_upstream_watch.py'
      - 'scripts/check-upstream-releases.py'
      - 'upstream-releases.json'
      - 'tools/upstream-sources.json'
permissions:
  contents: write
  issues: write
concurrency:
  group: kizuku-upstream-radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile scripts/upstream_watch.py
      - name: Test upstream scanner
        run: python -m unittest discover -s scripts -p 'test_upstream_watch.py'
      - name: Discover and compare upstreams
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/upstream_watch.py
      - name: Commit changed radar only
        run: |
          if [ -n "$(git status --porcelain -- tools/upstream-state.json docs/UPSTREAM_RADAR.md)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/upstream-state.json docs/UPSTREAM_RADAR.md
            git commit -m 'chore: refresh upstream radar [skip ci]'
            git pull --rebase origin main
            git push
          else
            echo 'Upstream radar unchanged'
          fi

      - name: Compare release tags with reviewed pins
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_REFERENCE_APKS: ${{ inputs.reference_apks }}
        run: |
          args=(--report "$RUNNER_TEMP/upstream-releases.json" --update-issue)
          if [[ "$DOWNLOAD_REFERENCE_APKS" == true ]]; then
            args+=(--download-dir "$RUNNER_TEMP/upstream-apks")
          fi
          python3 scripts/check-upstream-releases.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-release-evidence
          path: |
            ${{ runner.temp }}/upstream-releases.json
            ${{ runner.temp }}/upstream-apks/
          retention-days: 3
