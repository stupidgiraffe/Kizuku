name: Upstream radar
on:
  schedule:
    - cron: '23 2 * * *' # ~11:23 JST; best effort
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-watch.yml'
      - 'scripts/upstream_watch.py'
      - 'tools/upstream-sources.json'
permissions:
  contents: write
concurrency:
  group: kizuku-upstream-radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile scripts/upstream_watch.py
      - name: Discover and compare upstreams
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/upstream_watch.py
      - name: Commit changed radar only
        run: |
          if [ -n "$(git status --porcelain -- tools/upstream-state.json docs/UPSTREAM_RADAR.md)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tools/upstream-state.json docs/UPSTREAM_RADAR.md
            git commit -m 'chore: refresh upstream radar [skip ci]'
            git push
          else
            echo 'Upstream radar unchanged'
          fi
