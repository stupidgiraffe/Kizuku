name: Signed release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after signed APK runtime acceptance passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kizuku-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIZUKU_KEYSTORE_PATH: ${{ runner.temp }}/kizuku.p12
      KIZUKU_STORE_PASSWORD: ${{ secrets.KIZUKU_STORE_PASSWORD }}
      KIZUKU_KEY_PASSWORD: ${{ secrets.KIZUKU_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize encrypted signing secret
        env:
          KIZUKU_KEYSTORE_BASE64: ${{ secrets.KIZUKU_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$KIZUKU_KEYSTORE_BASE64"
          printf '%s' "$KIZUKU_KEYSTORE_BASE64" | base64 --decode > "$KIZUKU_KEYSTORE_PATH"
      - name: Build and verify signed release and instrumentation
        run: |
          ./gradlew -PtestBuildType=release :core:test :manager:assembleRelease :test-client:assembleRelease :manager:assembleReleaseAndroidTest :test-client:assembleReleaseAndroidTest :manager:lintRelease :test-client:lintRelease :compat:lintRelease --stacktrace
          python3 scripts/check-runtime-stubs.py manager/build/outputs/apk/release/manager-release.apk
          python3 scripts/verify-release.py
      - name: Retain signed test inputs
        uses: actions/upload-artifact@v4
        with:
          name: signed-${{ github.sha }}
          path: |
            manager/build/outputs/apk/release/*.apk
            compat/build/outputs/apk/release/*.apk
            test-client/build/outputs/apk/release/*.apk
            manager/build/outputs/apk/androidTest/release/*.apk
            test-client/build/outputs/apk/androidTest/release/*.apk
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$KIZUKU_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
  acceptance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: signed-${{ github.sha }}
          path: artifacts
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools emulator platforms;android-37.0 system-images;android-37.0;google_apis;x86_64'
      - name: Exercise signed APKs as ADB shell and root on Android 17
        env:
          KIZUKU_TEST_ROOT: 'true'
        run: scripts/run-emulator.sh artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-runtime-evidence-${{ github.sha }}
          path: smoke-evidence/
  publish:
    if: inputs.publish
    needs: [build, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: signed-${{ github.sha }}
          path: artifacts
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp artifacts/manager/build/outputs/apk/release/manager-release.apk dist/Kizuku-v0.1.0-preview.1.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          gh release create v0.1.0-preview.1 dist/* --target "$GITHUB_SHA" --title 'Kizuku 0.1.0 Preview 1' --prerelease --notes-file docs/RELEASE_NOTES.md
