name: Signed release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after signed APK runtime acceptance passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kizuku-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIZUKU_STORE_PASSWORD: ${{ secrets.KIZUKU_STORE_PASSWORD }}
      KIZUKU_KEY_PASSWORD: ${{ secrets.KIZUKU_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.31.6'
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize encrypted signing secret
        env:
          KIZUKU_KEYSTORE_BASE64: ${{ secrets.KIZUKU_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf 'KIZUKU_KEYSTORE_PATH=%s/kizuku.p12\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          test -n "$KIZUKU_KEYSTORE_BASE64"
          printf '%s' "$KIZUKU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kizuku.p12"
      - name: Build and verify signed release and instrumentation
        run: |
          ./gradlew -PtestBuildType=release :core:test :manager:assembleRelease :test-client:assembleRelease :manager:assembleReleaseAndroidTest :test-client:assembleReleaseAndroidTest :manager:lintRelease :test-client:lintRelease :compat:lintRelease --stacktrace
          python3 scripts/check-runtime-stubs.py manager/build/outputs/apk/release/manager-release.apk
          python3 scripts/verify-release.py
      - name: Retain signed test inputs
        uses: actions/upload-artifact@v4
        with:
          name: signed-${{ github.sha }}
          path: |
            manager/build/outputs/apk/release/*.apk
            compat/build/outputs/apk/release/*.apk
            test-client/build/outputs/apk/release/*.apk
            manager/build/outputs/apk/androidTest/release/*.apk
            test-client/build/outputs/apk/androidTest/release/*.apk
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$KIZUKU_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
  acceptance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sdk: ['36', '37.0']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: signed-${{ github.sha }}
          path: artifacts
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools emulator build-tools;37.0.0 platforms;android-${{ matrix.sdk }} system-images;android-${{ matrix.sdk }};google_apis;x86_64'
      - name: Exercise the signed update and fresh installs as ADB shell and root
        env:
          KIZUKU_EMULATOR_TARGET: android-${{ matrix.sdk }}
          KIZUKU_TEST_ROOT: 'true'
          KIZUKU_TEST_ADB: 'true'
          KIZUKU_TEST_SIGNED_UPDATE: 'true'
          KIZUKU_REQUIRE_NEWER_VERSION: ${{ inputs.publish }}
        run: scripts/run-emulator.sh artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-runtime-evidence-api-${{ matrix.sdk }}-${{ github.sha }}
          path: smoke-evidence/
  publish:
    if: inputs.publish
    needs: [build, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: signed-${{ github.sha }}
          path: artifacts
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          version=$(sed -n 's/^versionName=//p' release.properties)
          test -n "$version"
          asset="Kizuku-v${version}.apk"
          cp artifacts/manager/build/outputs/apk/release/manager-release.apk "dist/$asset"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v${version}" dist/* --target "$GITHUB_SHA" --title "Kizuku ${version}" "${flags[@]}" --notes-file docs/RELEASE_NOTES.md
          mkdir published
          gh release download "v${version}" --pattern "$asset" --pattern SHA256SUMS.txt --dir published
          cmp dist/SHA256SUMS.txt published/SHA256SUMS.txt
          (cd published && sha256sum --strict -c ../dist/SHA256SUMS.txt)
